name: topup_app
description: Voice-first mobile top-up for Afghan and international users (Pashto voice guidance, pay-per-topup).
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  flutter_stripe: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/ps/
    - assets/audio/fa/
    - assets/audio/en/
