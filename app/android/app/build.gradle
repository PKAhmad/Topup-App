plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

// Version comes from pubspec.yaml (flutter.versionCode / flutter.versionName
// in local.properties) — never hardcode it here again.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
android {
    namespace = 'app.topup.topup_app'
    compileSdk = 34
    ndkVersion = '26.1.10909125'
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig {
        applicationId = 'app.topup.topup_app' // PROVISIONAL — final name/keystore come at name-day, same as Karyab
        minSdk = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }
    buildTypes { release { signingConfig = signingConfigs.debug } }
}
flutter { source = '../..' }
